<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Bhakti Studio</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.ico.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin_login.css') }}">
</head>
<body>
    <!-- Background Images -->
    <div class="background-slideshow">
        <div class="slide active" style="background-image: url('{{ url_for('static', filename='images/avi1.jpeg') }}');"></div>
        <div class="slide" style="background-image: url('{{ url_for('static', filename='images/avi2.jpeg') }}');"></div>
        <div class="slide" style="background-image: url('{{ url_for('static', filename='images/avi3.jpeg') }}');"></div>
    </div>

    <!-- Login Container -->
    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo-section">
                <img src="{{ url_for('static', filename='images/LogoBhakti.png') }}" alt="Bhakti Studio" class="logo">
                <h1>🎵 Bhakti Studio</h1>
                <p>Admin Portal</p>
            </div>

            <!-- Login Form -->
            <form method="POST" class="login-form">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
                <div class="form-group">
                    <label for="username">👤 Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                </div>

                <div class="form-group">
                    <label for="password">🔒 Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <button type="submit" class="login-btn">
                    <span class="btn-text">Login</span>
                    <span class="btn-icon">→</span>
                </button>
            </form>


    <script>
        // Background slideshow
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(nextSlide, 4000);

        // Form animations
        document.querySelectorAll('.form-group input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });

            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.classList.remove('focused');
                }
            });
        });
    </script>
</body>
</html>
