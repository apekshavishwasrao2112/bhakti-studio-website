<!-- CHAT BUTTON -->
<div id="chatButton">
    <img src="{{ url_for('static', filename='images/LogoBhakti.png') }}" alt="logo">
</div>

<!-- CHAT BOX -->
<div id="chatBox" style="display:none;">

    <div id="chatHeader">
        🎙 Studio Assistant
    </div>

    <div id="chatMessages"></div>

    <div id="chatInputArea">
        <input type="text" id="userInput" placeholder="Type message...">
        <button id="sendBtn">Send</button>
    </div>

</div>

<style>

/* CHAT BUTTON */
#chatButton{
position:fixed;
bottom:20px;
right:20px;
width:70px;
height:70px;
border-radius:50%;
overflow:hidden;
cursor:pointer;
z-index:9999;
animation:blink 1.5s infinite;
background:white;
}

#chatButton img{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
}

/* BLINK EFFECT */
@keyframes blink{
0%{box-shadow:0 0 0 0 rgba(255,0,0,0.7);}
70%{box-shadow:0 0 0 15px rgba(255,0,0,0);}
100%{box-shadow:0 0 0 0 rgba(255,0,0,0);}
}

/* CHAT BOX */
#chatBox{
position:fixed;
bottom:100px;
right:20px;
width:320px;
background:white;
border-radius:12px;
box-shadow:0 5px 20px rgba(0,0,0,0.3);
z-index:9999;
font-family:Arial;
overflow:hidden;
}

/* HEADER */
#chatHeader{
background: linear-gradient(45deg, #ff416c, #ff4b2b);
color:white;
padding:12px;
font-weight:bold;
text-align:center;
}

/* MESSAGES */
#chatMessages{
height:230px;
overflow-y:auto;
padding:10px;
font-size:14px;
color:black;
}

/* INPUT AREA */
#chatInputArea{
display:flex;
border-top:1px solid #ddd;
}

#userInput{
flex:1;
padding:10px;
border:none;
outline:none;
}

#chatInputArea button{
background: linear-gradient(45deg, #ff416c, #ff4b2b);
color:white;
border:none;
padding:10px 15px;
cursor:pointer;
}

#chatInputArea button:hover{
background: linear-gradient(45deg, #ff416c, #ff4b2b);
}

/* CHAT BUBBLES */
.userMsg{
text-align:right;
margin:8px 0;
}

.userMsg span{
background: linear-gradient(45deg, #ff416c, #ff4b2b);
color:white;
padding:8px 12px;
border-radius:15px 15px 0 15px;
display:inline-block;
}

.botMsg{
text-align:left;
margin:8px 0;
}

.botMsg span{
background:#f1f1f1;
padding:8px 12px;
border-radius:15px 15px 15px 0;
display:inline-block;
}

/* QUICK BUTTONS */
.quickBtn{
margin:5px 3px;
padding:6px 10px;
border:none;
border-radius:15px;
background:#eee;
cursor:pointer;
}

.quickBtn:hover{
background:#ddd;
}

/* TYPING */
.typing{
font-size:12px;
color:gray;
margin:5px;
}

</style>

<script>

document.addEventListener("DOMContentLoaded", function(){

let button = document.getElementById("chatButton");
let box = document.getElementById("chatBox");
let chat = document.getElementById("chatMessages");
let input = document.getElementById("userInput");
let sendBtn = document.getElementById("sendBtn");


button.onclick = function(){

box.style.display = box.style.display === "none" ? "block" : "none";

if(chat.innerHTML===""){

chat.innerHTML = `
<div class="botMsg">
<span>
🙏 नमस्कार! <br>
🎙 भक्ती स्टुडिओ मध्ये आपले हार्दिक स्वागत! 💫 <br><br>

👇 खालील पर्याय निवडा 👇<br><br>

<button class="quickBtn" onclick="quickMsg('location')">📍 Location</button>
<button class="quickBtn" onclick="quickMsg('price')">💰 Price</button>
<button class="quickBtn" onclick="quickMsg('demo')">🎧 Demo</button>
<a href="/booking">
<button style="background:#c72c17;color:white;padding:10px;border:none;border-radius:10px;">
📅 Book Now
</button>
</a>
</span>
</div>
`;

}

};


input.addEventListener("keypress", function(e){
if(e.key === "Enter"){
sendMessage();
}
});

sendBtn.addEventListener("click", sendMessage);

});



function quickMsg(text){
document.getElementById("userInput").value = text;
sendMessage();
}

function sendMessage(){

let input = document.getElementById("userInput");
let message = input.value;

if(message.trim()==="") return;

let chat = document.getElementById("chatMessages");

/* USER MESSAGE */
chat.innerHTML += `
<div class="userMsg">
<span>${message}</span>
</div>
`;

/* TYPING */
let typing = document.createElement("div");

typing.className = "typing";

typing.innerText = "Typing...";

chat.appendChild(typing);

chat.scrollTop = chat.scrollHeight;

/* FETCH */
fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:message
})
})

.then(async response => {

if(!response.ok){
throw new Error("Server Error");
}

return response.json();

})

.then(data => {

typing.remove();

chat.innerHTML += `
<div class="botMsg">
<span>${data.reply}</span>
</div>
`;

chat.scrollTop = chat.scrollHeight;

})

.catch(error => {

typing.remove();

chat.innerHTML += `
<div class="botMsg">
<span>⚠ Server error. Please try again.</span>
</div>
`;

console.log(error);

});

input.value="";
}
</script>
